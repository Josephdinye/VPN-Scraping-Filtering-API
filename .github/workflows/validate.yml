name: Global Node Validation API Sync

on:
  schedule:
    - cron: "*/30 * * * *" # Every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sweep-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          mkdir -p raw dist api
          pip install -r requirements.txt

      - name: Scrape feeds
        run: python scraper.py

      - name: Filter working only
        run: python validator.py

      - name: Commit & Push
        run: |
          git config user.name "vpn-bot"
          git config user.email "bot@github.com"
          git pull --rebase origin main || true
          git add raw/ dist/ api/ || true
          if [! -f dist/working.txt ]; then
            echo "No working file"
            exit 0
          fi
          WORKING=$(cat dist/working.txt | wc -l)
          echo "Working: $WORKING nodes"
          if git diff --staged --quiet; then
            echo "No changes - same nodes"
            exit 0
          fi
          git commit -m "auto: $WORKING working nodes $(date -u +'%Y-%m-%d %H:%M')"
          git push