name: Global Node Validation API Sync

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # <-- THIS FIXES 403

jobs:
  sweep-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          mkdir -p raw dist api
          pip install -r requirements.txt

      - name: Scrape feeds
        run: python scraper.py

      - name: Filter working only
        run: python validator.py

      - name: Commit & Push
        run: |
          git config user.name "vpn-bot"
          git config user.email "bot@github.com"
          git add raw/ dist/
          WORKING=$(cat dist/working.txt | wc -l)
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "auto: $WORKING working nodes"
          git push